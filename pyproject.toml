[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hecktor2026"
version = "0.1.0"
description = "HECKTOR 2026 Challenge unified pipeline"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "monai",
    "nibabel",
    "SimpleITK",
    "scikit-image",
    "timm",
    "nnunetv2",
    "numpy",
    "scipy",
    "pandas",
    "pyarrow",
    "h5py",
    "lifelines",
    "scikit-learn",
    "joblib",
    "matplotlib",
    "seaborn",
    "tensorboard",
    "tqdm",
    "pyyaml",
    "optuna",
    "lightgbm",
]
